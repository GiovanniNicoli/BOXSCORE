const {

// --- CONSTANTS ---
const MAX_PLAYERS = 15;
const QUARTER_LENGTH_SEC = 10 * 60; // 10 minutes
const OVERTIME_LENGTH_SEC = 5 * 60; // 5 minutes

const SAMPLE_NAMES = ['A. Rossi', 'B. Bianchi', 'C. Verdi', 'D. Neri', 'E. Gialli', 'F. Blu', 'G. Marrone', 'H. Rosa', 'I. Viola', 'J. Azzurro', 'K. Lilla', 'L. Arancio', 'M. Grigio', 'N. Celeste', 'O. Oro'];

// --- UTILS ---
const secToMinStr = sec => {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
};
const minStrToSec = str => {
  if (!str) return 0;
  const parts = str.split(':');
  if (parts.length !== 2) return 0;
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
};
const formatTime = sec => {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m.toString()}:${s.toString().padStart(2, '0')}`;
};
const getQuarterLabel = q => {
  if (q <= 4) return `${q}°`;
  return `OT${q - 4}`;
};
const getQuarterLength = q => {
  return q > 4 ? OVERTIME_LENGTH_SEC : QUARTER_LENGTH_SEC;
};
const getGameStartSecondsForQuarter = q => {
  if (q <= 1) return 0;
  let total = 0;
  // Add regular quarters
  const regularQs = Math.min(q - 1, 4);
  total += regularQs * QUARTER_LENGTH_SEC;

  // Add OT periods if any
  if (q > 5) {
    total += (q - 5) * OVERTIME_LENGTH_SEC;
  }
  return total;
};
const csvEscape = val => {
  if (val === null || typeof val === 'undefined') return '""';
  const s = String(val);
  return '"' + s.replace(/"/g, '""') + '"';
};
const calculateAdvancedStats = (p, gameTotals) => {
  const trb = p.offReb + p.defReb;
  const fga = p.twoAtt + p.threeAtt;
  const fgm = p.twoMade + p.threeMade;
  const efg = fga > 0 ? ((fgm + 0.5 * p.threeMade) / fga * 100).toFixed(1) : '-';
  const tsa = fga + 0.44 * p.freeAtt;
  const ts = tsa > 0 ? (p.points / (2 * tsa) * 100).toFixed(1) : '-';
  let astToRatio;
  if (p.turnover > 0) {
    astToRatio = (p.assist / p.turnover).toFixed(2);
  } else {
    astToRatio = p.assist > 0 ? 'INF' : '0.00';
  }
  const gmSc = (p.points + 0.4 * fgm - 0.7 * fga - 0.4 * (p.freeAtt - p.freeMade) + 0.7 * p.offReb + 0.3 * p.defReb + p.steal + 0.7 * p.assist + 0.7 * p.blocks - 0.4 * p.foul - p.turnover).toFixed(1);
  const playerPIE = p.points + fgm + p.freeMade - fga - p.freeAtt + p.defReb + 0.5 * p.offReb + p.assist + p.steal + 0.5 * p.blocks - p.foul - p.turnover;
  const gamePIE = gameTotals.pts + gameTotals.fgm + gameTotals.ftm - gameTotals.fga - gameTotals.fta + gameTotals.dreb + 0.5 * gameTotals.oreb + gameTotals.ast + gameTotals.stl + 0.5 * gameTotals.blk - gameTotals.pf - gameTotals.to;
  const pie = gamePIE > 0 ? (playerPIE / gamePIE * 100).toFixed(1) : '-';
  return {
    trb,
    efg,
    ts,
    astToRatio,
    gmSc,
    pie
  };
};
const exportBoxscoreCSV = (players, opponentStats, quarter) => {
  const headers = ["Name", "Minutes", "Points", "2PT_Made", "2PT_Att", "2PT_%", "3PT_Made", "3PT_Att", "3PT_%", "FT_Made", "FT_Att", "FT_%", "FG_Made", "FG_Att", "FG_%", "Assist", "OffReb", "DefReb", "TRB", "Steal", "Blocks", "Turnover", "Fouls", "+/-", "eFG%", "TS%", "AST/TO", "GmSc", "PIE", "2PT_Miss", "3PT_Miss", "FT_Miss"];
  const teamTotals = players.reduce((acc, p) => {
    acc.points += p.points;
    acc.twoMade += p.twoMade;
    acc.twoAtt += p.twoAtt;
    acc.threeMade += p.threeMade;
    acc.threeAtt += p.threeAtt;
    acc.freeMade += p.freeMade;
    acc.freeAtt += p.freeAtt;
    acc.offReb += p.offReb;
    acc.defReb += p.defReb;
    acc.assist += p.assist;
    acc.steal += p.steal;
    acc.blocks += p.blocks;
    acc.foul += p.foul;
    acc.turnover += p.turnover;
    return acc;
  }, {
    points: 0,
    twoMade: 0,
    twoAtt: 0,
    threeMade: 0,
    threeAtt: 0,
    freeMade: 0,
    freeAtt: 0,
    offReb: 0,
    defReb: 0,
    assist: 0,
    steal: 0,
    blocks: 0,
    foul: 0,
    turnover: 0
  });
  const gameTotals = {
    pts: teamTotals.points + (opponentStats.twoMade * 2 + opponentStats.threeMade * 3 + opponentStats.freeMade),
    fgm: teamTotals.twoMade + teamTotals.threeMade + opponentStats.twoMade + opponentStats.threeMade,
    fga: teamTotals.twoAtt + teamTotals.threeAtt + opponentStats.twoAtt + opponentStats.threeAtt,
    ftm: teamTotals.freeMade + opponentStats.freeMade,
    fta: teamTotals.freeAtt + opponentStats.freeAtt,
    dreb: teamTotals.defReb + opponentStats.defReb,
    oreb: teamTotals.offReb + opponentStats.offReb,
    ast: teamTotals.assist + 0,
    stl: teamTotals.steal + 0,
    blk: teamTotals.blocks + opponentStats.blocks,
    pf: teamTotals.foul + opponentStats.foul,
    to: teamTotals.turnover + opponentStats.turnover
  };
  const rows = players.map(p => {
    const twoPerc = p.twoAtt > 0 ? (p.twoMade / p.twoAtt * 100).toFixed(1) : '';
    const threePerc = p.threeAtt > 0 ? (p.threeMade / p.threeAtt * 100).toFixed(1) : '';
    const ftPerc = p.freeAtt > 0 ? (p.freeMade / p.freeAtt * 100).toFixed(1) : '';
    const fgMade = p.twoMade + p.threeMade;
    const fgAtt = p.twoAtt + p.threeAtt;
    const fgPerc = fgAtt > 0 ? (fgMade / fgAtt * 100).toFixed(1) : '';
    const {
      trb,
      efg,
      ts,
      astToRatio,
      gmSc,
      pie
    } = calculateAdvancedStats(p, gameTotals);
    const twoMiss = p.twoAtt - p.twoMade;
    const threeMiss = p.threeAtt - p.threeMade;
    const ftMiss = p.freeAtt - p.freeMade;
    return [p.name || `Player ${p.id + 1}`, secToMinStr(p.secondsPlayed), p.points, p.twoMade, p.twoAtt, twoPerc, p.threeMade, p.threeAtt, threePerc, p.freeMade, p.freeAtt, ftPerc, fgMade, fgAtt, fgPerc, p.assist, p.offReb, p.defReb, trb, p.steal, p.blocks, p.turnover, p.foul, p.plusMinus, efg, ts, astToRatio, gmSc, pie, twoMiss, threeMiss, ftMiss].map(csvEscape).join(',');
  });

  // Opponent Row
  const oppRows = ["OPPONENT", "",
  // Minutes
  opponentStats.twoMade * 2 + opponentStats.threeMade * 3 + opponentStats.freeMade,
  // Points
  opponentStats.twoMade, opponentStats.twoAtt, "", opponentStats.threeMade, opponentStats.threeAtt, "", opponentStats.freeMade, opponentStats.freeAtt, "", "", "", "",
  // FG
  "", opponentStats.offReb, opponentStats.defReb, opponentStats.offReb + opponentStats.defReb,
  // Reb
  "", opponentStats.blocks, opponentStats.turnover, opponentStats.foul, "", "", "", "", "", "",
  // Adv stats
  opponentStats.twoMiss, opponentStats.threeMiss, opponentStats.ftMiss].map(csvEscape).join(',');
  const csvContent = [headers.map(csvEscape).join(','), ...rows, oppRows].join('\r\n');
  const blob = new Blob([csvContent], {
    type: 'text/csv;charset=utf-8;'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const quarterLabel = getQuarterLabel(quarter);
  a.download = `boxscore_${quarterLabel}_${timestamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
const generatePDF = (teamName, oppName, players, opponentStats, events) => {
  // Safe access to jsPDF
  const jsPDF = window.jspdf ? window.jspdf.jsPDF : window.jsPDF;
  if (!jsPDF) {
    alert("PDF library not loaded correctly. Please refresh.");
    return;
  }
  const doc = new jsPDF('p', 'mm', 'a4');

  // PAGE 1: Summary
  doc.setFontSize(16);
  doc.setFont("helvetica", "bold");
  doc.text(`${teamName.toUpperCase()} VS ${oppName.toUpperCase()}`, 105, 20, {
    align: 'center'
  });
  doc.setFontSize(12);
  doc.setFont("helvetica", "normal");
  const dateStr = new Date().toLocaleDateString();
  doc.text(dateStr, 105, 30, {
    align: 'center'
  });

  // Calculate Scores Logic
  // Determine max quarter played
  let maxQ = 4;
  events.forEach(e => {
    const regMatch = e.timestamp.match(/^(\d+)°/);
    const otMatch = e.timestamp.match(/^OT(\d+)/);
    if (regMatch) maxQ = Math.max(maxQ, parseInt(regMatch[1]));
    if (otMatch) maxQ = Math.max(maxQ, 4 + parseInt(otMatch[1]));
  });

  // Initialize score arrays
  const qScores = {
    team: Array(maxQ).fill(0),
    opp: Array(maxQ).fill(0)
  };
  events.forEach(e => {
    let q = 1;
    const regMatch = e.timestamp.match(/^(\d+)°/);
    const otMatch = e.timestamp.match(/^OT(\d+)/);
    if (regMatch) q = parseInt(regMatch[1]);else if (otMatch) q = 4 + parseInt(otMatch[1]);
    if (q >= 1 && q <= maxQ) {
      qScores.team[q - 1] += e.teamDelta;
      qScores.opp[q - 1] += e.oppDelta;
    }
  });
  const teamTotal = qScores.team.reduce((a, b) => a + b, 0);
  const oppTotal = qScores.opp.reduce((a, b) => a + b, 0);

  // Dynamic Header
  const scoreTableHead = ['TABELLINO'];
  for (let i = 1; i <= maxQ; i++) {
    scoreTableHead.push(getQuarterLabel(i));
  }
  scoreTableHead.push('TOT');
  doc.autoTable({
    startY: 40,
    head: [scoreTableHead],
    body: [[oppName, ...qScores.opp, oppTotal], [teamName, ...qScores.team, teamTotal]],
    theme: 'grid',
    headStyles: {
      fillColor: [220, 220, 220],
      textColor: 0,
      fontStyle: 'bold'
    },
    styles: {
      halign: 'center',
      textColor: 0
    }
  });

  // Stats Logic
  const tt = players.reduce((acc, p) => {
    acc.twoMade += p.twoMade;
    acc.twoAtt += p.twoAtt;
    acc.threeMade += p.threeMade;
    acc.threeAtt += p.threeAtt;
    acc.freeMade += p.freeMade;
    acc.freeAtt += p.freeAtt;
    acc.offReb += p.offReb;
    acc.defReb += p.defReb;
    acc.assist += p.assist;
    acc.steal += p.steal;
    acc.blocks += p.blocks;
    acc.foul += p.foul;
    acc.turnover += p.turnover;
    return acc;
  }, {
    twoMade: 0,
    twoAtt: 0,
    threeMade: 0,
    threeAtt: 0,
    freeMade: 0,
    freeAtt: 0,
    offReb: 0,
    defReb: 0,
    assist: 0,
    steal: 0,
    blocks: 0,
    foul: 0,
    turnover: 0
  });
  const formatPct = (m, a) => a > 0 ? (m / a * 100).toFixed(1) : '0.0';
  const teamStatsBody = [['2P', tt.twoMade, tt.twoAtt, formatPct(tt.twoMade, tt.twoAtt)], ['3P', tt.threeMade, tt.threeAtt, formatPct(tt.threeMade, tt.threeAtt)], ['TIRI DAL CAMPO', tt.twoMade + tt.threeMade, tt.twoAtt + tt.threeAtt, formatPct(tt.twoMade + tt.threeMade, tt.twoAtt + tt.threeAtt)], ['LIBERI', tt.freeMade, tt.freeAtt, formatPct(tt.freeMade, tt.freeAtt)], ['RIMBALZI', tt.offReb + tt.defReb, '', ''], ['RIMBALZI DIFENSIVI', tt.defReb, '', ''], ['RIMBALZI OFFENSIVI', tt.offReb, '', ''], ['ASSIST', tt.assist, '', ''], ['PALLE PERSE', tt.turnover, '', ''], ['PALLE RECUPERATE', tt.steal, '', ''], ['STOPPATE', tt.blocks, '', '']];
  const os = opponentStats;
  const oppStatsBody = [['2P', os.twoMade, os.twoAtt, formatPct(os.twoMade, os.twoAtt)], ['3P', os.threeMade, os.threeAtt, formatPct(os.threeMade, os.threeAtt)], ['TIRI DAL CAMPO', os.twoMade + os.threeMade, os.twoAtt + os.threeAtt, formatPct(os.twoMade + os.threeMade, os.twoAtt + os.threeAtt)], ['LIBERI', os.freeMade, os.freeAtt, formatPct(os.freeMade, os.freeAtt)], ['RIMBALZI', os.offReb + os.defReb, '', ''], ['RIMBALZI DIFENSIVI', os.defReb, '', ''], ['RIMBALZI OFFENSIVI', os.offReb, '', ''], ['ASSIST', '-', '', ''], ['PALLE PERSE', os.turnover, '', ''], ['PALLE RECUPERATE', '-', '', ''], ['STOPPATE', os.blocks, '', '']];
  let finalY = doc.lastAutoTable.finalY + 15;
  doc.autoTable({
    startY: finalY,
    head: [[teamName.toUpperCase(), 'SEGNATI', 'TENTATI', '%']],
    body: teamStatsBody,
    theme: 'grid',
    headStyles: {
      fillColor: [220, 220, 220],
      textColor: 0
    },
    columnStyles: {
      0: {
        fontStyle: 'bold'
      }
    },
    styles: {
      textColor: 0
    }
  });
  let nextY = doc.lastAutoTable.finalY + 10;
  if (nextY > 250) {
    doc.addPage();
    nextY = 20;
  }
  doc.autoTable({
    startY: nextY,
    head: [[oppName.toUpperCase(), 'SEGNATI', 'TENTATI', '%']],
    body: oppStatsBody,
    theme: 'grid',
    headStyles: {
      fillColor: [220, 220, 220],
      textColor: 0
    },
    columnStyles: {
      0: {
        fontStyle: 'bold'
      }
    },
    styles: {
      textColor: 0
    }
  });

  // PAGE 2: Box Score (Landscape)
  doc.addPage('a4', 'landscape');
  doc.text('BOX SCORE', 14, 15);
  const gameTotals = {
    pts: teamTotal + oppTotal,
    fgm: tt.twoMade + tt.threeMade + os.twoMade + os.threeMade,
    fga: tt.twoAtt + tt.threeAtt + os.twoAtt + os.threeAtt,
    ftm: tt.freeMade + os.freeMade,
    fta: tt.freeAtt + os.freeAtt,
    dreb: tt.defReb + os.defReb,
    oreb: tt.offReb + os.offReb,
    ast: tt.assist,
    stl: tt.steal,
    blk: tt.blocks + os.blocks,
    pf: tt.foul + os.foul,
    to: tt.turnover + os.turnover
  };
  const boxBody = players.filter(p => p.secondsPlayed > 0 || p.name).map(p => {
    const {
      trb,
      efg,
      ts,
      astToRatio,
      gmSc,
      pie
    } = calculateAdvancedStats(p, gameTotals);
    return [p.name || `Player ${p.id + 1}`, secToMinStr(p.secondsPlayed), p.points, `${p.twoMade}/${p.twoAtt}`, formatPct(p.twoMade, p.twoAtt), `${p.threeMade}/${p.threeAtt}`, formatPct(p.threeMade, p.threeAtt), `${p.freeMade}/${p.freeAtt}`, formatPct(p.freeMade, p.freeAtt), `${p.twoMade + p.threeMade}/${p.twoAtt + p.threeAtt}`, formatPct(p.twoMade + p.threeMade, p.twoAtt + p.threeAtt), p.assist, p.offReb, p.defReb, trb, p.steal, p.blocks, p.turnover, p.foul, p.plusMinus, efg + '%', ts + '%', astToRatio, gmSc, pie + '%'];
  });
  doc.autoTable({
    startY: 20,
    head: [['Name', 'Min', 'Pts', '2P', '%', '3P', '%', 'FT', '%', 'FG', '%', 'Ast', 'OR', 'DR', 'TR', 'Stl', 'Blk', 'TO', 'PF', '+/-', 'eFG', 'TS', 'A/T', 'GmSc', 'PIE']],
    body: boxBody,
    theme: 'grid',
    headStyles: {
      fillColor: [220, 220, 220],
      textColor: 0,
      fontSize: 8
    },
    styles: {
      fontSize: 8,
      cellPadding: 1,
      textColor: 0
    }
  });

  // PAGE 3: Chart
  doc.addPage('a4', 'portrait');
  doc.text('Score Difference Chart', 14, 15);
  let dataPoints = [{
    time: 0,
    diff: 0
  }];
  // Calculate total game duration dynamically based on maxQ
  const totalGameSeconds = getGameStartSecondsForQuarter(maxQ + 1); // Get start of next theoretical period to get full duration

  events.forEach(e => {
    const prevPoint = dataPoints[dataPoints.length - 1];
    if (e.totalSecondsElapsed > prevPoint.time) {
      dataPoints.push({
        time: e.totalSecondsElapsed,
        diff: prevPoint.diff
      });
    }
    const newDiff = e.teamScoreSnapshot + e.teamDelta - (e.oppScoreSnapshot + e.oppDelta);
    dataPoints.push({
      time: e.totalSecondsElapsed,
      diff: newDiff
    });
  });
  const lastTime = dataPoints[dataPoints.length - 1].time;
  if (lastTime < totalGameSeconds) {
    dataPoints.push({
      time: lastTime,
      diff: dataPoints[dataPoints.length - 1].diff
    });
  }
  const startX = 20;
  const endX = 190;
  const width = endX - startX;
  const startY = 100;
  const height = 60;
  const maxDiff = Math.max(10, ...dataPoints.map(p => Math.abs(p.diff))) + 2;
  const scaleY = val => startY - val / maxDiff * (height / 2);
  const scaleX = t => startX + t / totalGameSeconds * width;
  doc.setDrawColor(200, 200, 200);
  doc.line(startX, startY, endX, startY);
  doc.setDrawColor(0, 0, 255);
  doc.setLineWidth(0.5);
  for (let i = 1; i < dataPoints.length; i++) {
    const p1 = dataPoints[i - 1];
    const p2 = dataPoints[i];
    doc.line(scaleX(p1.time), scaleY(p1.diff), scaleX(p2.time), scaleY(p2.diff));
  }
  doc.setFontSize(10);
  doc.text(`+${maxDiff}`, startX - 2, startY - height / 2);
  doc.text(`-${maxDiff}`, startX - 2, startY + height / 2);
  doc.text("0", startX - 5, startY);

  // Dynamic Period Labels on Chart
  for (let q = 1; q <= maxQ; q++) {
    // Draw label at end of each period
    const periodEndSec = getGameStartSecondsForQuarter(q + 1);
    const label = getQuarterLabel(q);
    doc.text(label, scaleX(periodEndSec), startY + height / 2 + 5, {
      align: 'center'
    });
    // Draw vertical grid line
    doc.setDrawColor(230, 230, 230);
    doc.line(scaleX(periodEndSec), startY - height / 2, scaleX(periodEndSec), startY + height / 2);
  }
  doc.save(`${teamName}_vs_${oppName}_report.pdf`);
};

const useGameTimer = (initialSeconds, onTick) => {
  const [timeLeft, setTimeLeft] = useState(initialSeconds);
  const [isRunning, setIsRunning] = useState(false);
  const intervalRef = useRef(null);
  const tick = useCallback(() => {
    setTimeLeft(prev => {
      if (prev > 0) {
        onTick();
        return prev - 1;
      }
      setIsRunning(false);
      return 0;
    });
  }, [onTick]);
  useEffect(() => {
    if (isRunning) {
      intervalRef.current = window.setInterval(tick, 1000);
    } else {
      if (intervalRef.current) {
        clearInterval(intervalRef.current);
      }
    }
    return () => {
      if (intervalRef.current) {
        clearInterval(intervalRef.current);
      }
    };
  }, [isRunning, tick]);
  const toggleTimer = useCallback(() => {
    setIsRunning(prev => !prev);
  }, []);
  const resetTimer = useCallback(() => {
    setIsRunning(false);
    setTimeLeft(initialSeconds);
  }, [initialSeconds]);
  const setTime = useCallback(seconds => {
    setTimeLeft(seconds);
  }, []);
  return {
    timeLeft,
    isRunning,
    toggleTimer,
    resetTimer,
    setTime
  };
};
